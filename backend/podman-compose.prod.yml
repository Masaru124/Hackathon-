version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Containerfile
    container_name: scamshield-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/scamshield
      - REDIS_URL=redis://redis:6379
      - BLOCKCHAIN_RPC_URL=https://polygon-mumbai.infura.io/v3/YOUR_INFURA_PROJECT_ID
      - CONTRACT_ADDRESS=0x0000000000000000000000000000000000000000000
      - PRIVATE_KEY=your_private_key_here
      - JWT_SECRET_KEY=your_jwt_secret_key_here
      - ENVIRONMENT=production
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - scamshield-network

  mongodb:
    image: mongo:7.0
    container_name: scamshield-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=scamshield
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped
    networks:
      - scamshield-network

  redis:
    image: redis:7.2-alpine
    container_name: scamshield-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - scamshield-network

  nginx:
    image: nginx:alpine
    container_name: scamshield-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - scamshield-network

volumes:
  mongodb_data:
  redis_data:

networks:
  scamshield-network:
    driver: bridge
